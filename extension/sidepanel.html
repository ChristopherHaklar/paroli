<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paroli Reader</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script type="module" src="sidepanel.js"></script>
</head>
<body>
  <header class="bar">
    <div class="transport">
      <button id="prev" class="icon" title="Previous sentence (←)" aria-label="Previous sentence">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button id="play" class="icon primary" title="Play / pause (Space)" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <button id="stop" class="icon" title="Stop (Esc)" aria-label="Stop">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <button id="next" class="icon" title="Next sentence (→)" aria-label="Next sentence">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
    </div>
    <div class="status">
      <span id="lang" class="badge" hidden></span>
      <span id="status">Ready</span>
    </div>
  </header>

  <div class="progress">
    <input id="seek" type="range" min="0" max="0" value="0" step="1" aria-label="Sentence position" disabled>
    <span id="count"></span>
  </div>

  <div id="error" class="error" role="alert" hidden>
    <span id="error-text"></span>
    <button id="error-settings" class="secondary" hidden>Open settings</button>
  </div>

  <main id="text">
    <section id="empty" class="empty">
      <p class="hint">Select text on a page, then press <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> or right-click → <strong>Read with Paroli</strong>.</p>
      <button id="read-selection" class="wide">Read selection from page</button>
      <textarea id="paste" rows="6" placeholder="…or paste text here"></textarea>
      <button id="read-paste" class="wide secondary">Read pasted text</button>
    </section>
    <article id="doc" hidden></article>
  </main>

  <footer class="bar controls">
    <label class="field">
      <span>Voice</span>
      <select id="voice"></select>
    </label>
    <label class="field speed">
      <span>Speed <output id="speed-value"></output></span>
      <input id="speed" type="range" min="0.5" max="3" step="0.1">
    </label>
    <div class="tools">
      <button id="follow" class="icon toggle" title="Follow along (auto-scroll)" aria-label="Follow along" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="new" class="icon" title="New text" aria-label="New text">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="open-settings" class="icon" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </footer>

  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <label class="field">
        <span>Server URL</span>
        <input id="server" type="url" placeholder="http://localhost:8000/v1" required>
      </label>
      <p id="server-result" class="muted"></p>
      <div class="row">
        <button id="test-server" type="button" class="secondary">Test connection</button>
        <button value="save">Save</button>
      </div>
      <p class="muted small">Shortcuts: Space play/pause · ← → sentence · [ ] speed · Esc stop. Change the global shortcut at chrome://extensions/shortcuts.</p>
    </form>
  </dialog>
</body>
</html>
